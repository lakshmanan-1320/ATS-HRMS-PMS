openapi: 3.0.3
info:
  title: Attendance Check-In / Check-Out API
  version: 1.0.0
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /attendance/check-in:
    post:
      tags: [Attendance]
      summary: Check in for the current attendance date
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
            maxLength: 120
          required: false
          description: Optional key used to safely retry the same punch request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PunchRequest'
      responses:
        '200':
          description: Check-in successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
        '400':
          description: Missing or invalid coordinates
        '401':
          description: Unauthorized
        '409':
          description: Already checked in
        '500':
          description: Internal server error
  /attendance/check-out:
    post:
      tags: [Attendance]
      summary: Check out from the active attendance record
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
            maxLength: 120
          required: false
          description: Optional key used to safely retry the same punch request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PunchRequest'
      responses:
        '200':
          description: Check-out successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckOutResponse'
        '400':
          description: Missing or invalid coordinates
        '401':
          description: Unauthorized
        '409':
          description: Missing active check-in or already checked out
        '500':
          description: Internal server error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PunchRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          example: 13.0827
        longitude:
          type: number
          example: 80.2707
        selfieUrl:
          type: string
          nullable: true
          example: https://cdn.example.com/selfie.jpg
        deviceInfo:
          type: object
          additionalProperties: true
          example:
            platform: Android
            browser: Chrome
    CheckInResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Check-in successful
        data:
          type: object
          properties:
            attendanceId:
              type: string
              format: uuid
            checkInTime:
              type: string
              example: '2026-06-19T09:05:00+05:30'
            latitude:
              type: number
            longitude:
              type: number
            zoneName:
              type: string
              nullable: true
            distanceMeters:
              type: integer
              nullable: true
            isWithinFence:
              type: boolean
              nullable: true
    CheckOutResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Check-out successful
        data:
          type: object
          properties:
            attendanceId:
              type: string
              format: uuid
            checkOutTime:
              type: string
              example: '2026-06-19T18:15:00+05:30'
            workDurationMinutes:
              type: integer
              example: 550
